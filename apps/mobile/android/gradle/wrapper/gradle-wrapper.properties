# =============================================================================
# Gradle wrapper pin.
#
# app/build.gradle uses Android Gradle Plugin 8.2.2 + Kotlin 1.9.22, which
# require Gradle 8.2+ and are NOT compatible with Gradle 9.x. Pinning here stops
# a machine-wide Gradle 9 install (this repo previously had a .gradle/9.2.0
# cache) from being picked up and breaking the build.
#
# If you bump AGP, bump this in step - see the AGP release notes for the
# minimum supported Gradle version.
# =============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
