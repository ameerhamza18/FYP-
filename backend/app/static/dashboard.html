<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLayer — Security Operations Center</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
        --red:#f85149;--orange:#d29922;--green:#3fb950;--blue:#58a6ff;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
  h1{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .login-card{max-width:380px;margin:10vh auto;background:var(--panel);border:1px solid var(--border);
              border-radius:12px;padding:28px}
  .login-card input{width:100%;padding:10px;margin:6px 0 14px;background:var(--bg);color:var(--text);
              border:1px solid var(--border);border-radius:8px}
  button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .stat .num{font-size:30px;font-weight:700}
  .stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--green)}.blue{color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .panel h2{font-size:15px;margin-bottom:12px;color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .b-critical{background:#f8514922;color:var(--red);border:1px solid var(--red)}
  .b-high{background:#f8514918;color:var(--red)}
  .b-medium{background:#d2992222;color:var(--orange)}
  .b-low{background:#3fb95022;color:var(--green)}
  .bar{height:10px;background:var(--blue);border-radius:5px;min-width:2px}
  #error{color:var(--red);margin-top:10px;display:none}
  .hidden{display:none}
  header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login-card">
  <h1>🛡️ TrustLayer</h1>
  <p class="sub">Security Operations Center — Administrator Sign-in</p>
  <input id="email" type="email" placeholder="Admin email" value="admin@trustlayer.com">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Sign in</button>
  <p id="error"></p>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashView" class="hidden">
  <header class="top">
    <div>
      <h1>🛡️ TRUSTLAYER SECURITY CENTER</h1>
      <p class="sub">SOC-style threat monitoring &amp; campaign detection</p>
    </div>
    <button onclick="logout()">Sign out</button>
  </header>

  <div class="grid" id="statGrid"></div>

  <div class="row">
    <div class="panel">
      <h2>Threat Trend (14 days)</h2>
      <table id="trendTable"><thead><tr><th>Date</th><th>Total</th><th>High risk</th><th></th></tr></thead><tbody></tbody></table>
    </div>
    <div class="panel">
      <h2>Top Attack Techniques</h2>
      <table id="techTable"><thead><tr><th>#</th><th>Technique</th><th>Detections</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <h2>🛰️ Coordinated Campaigns</h2>
    <table id="campTable"><thead><tr><th>Severity</th><th>Reports</th><th>Users</th><th>First seen</th><th>Sample</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
