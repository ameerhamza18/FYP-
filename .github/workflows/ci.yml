name: TrustLayer CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests & security self-attack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate dataset & train ML model
        run: |
          python -m ml.training.generate_dataset
          python -m ml.training.train_model
      # The app mounts `app/static` relative to the CWD, so pytest must run
      # from backend/ (running it from the repo root raises RuntimeError).
      - name: Run test suite
        working-directory: backend
        run: python -m pytest ../tests -v
      - name: Run live ethical self-attack security suite
        working-directory: backend
        run: |
          PYTHONPATH="..:." uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          python ../security/security-tests/run_security_checks.py http://127.0.0.1:8000
          kill $SERVER_PID || true

  web-build:
    name: Web build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api
        run: npm run build

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile .
      - name: Build web image
        run: |
          docker build -f infrastructure/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8001/api .

  flutter-analyze:
    name: Mobile static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - name: Mobile unit & widget tests
        working-directory: apps/mobile
        run: flutter test
